<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeko</title>
    <link rel="icon" href="icon.png" />
    <!--
      Pagina d'avvio della finestra (risorse di Neutralino). Neutralino avvia il servizio
      (estensione: node server/jeko.js); qui si aspetta che risponda e poi si apre la web-app,
      servita dal servizio stesso.
    -->
    <style>
      :root {
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --line: #2c2c32;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      .logo {
        font:
          600 1.25rem ui-monospace,
          Consolas,
          monospace;
        letter-spacing: -0.02em;
      }
      .dot {
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin-right: 0.5rem;
        border-radius: 50%;
        background: #0ea5e9;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      p {
        color: var(--muted);
      }
      code {
        font:
          12px ui-monospace,
          Consolas,
          monospace;
        padding: 0.1rem 0.3rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        word-break: break-all;
      }
      .error {
        color: #dc2626;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">jeko</div>
      <p id="wait"><span class="dot"></span>Avvio del servizio…</p>
      <div id="fail" hidden>
        <p class="error">Il servizio di Jeko non risponde.</p>
        <p>
          Serve <strong>Node.js 22</strong> o successivo, installato e nel PATH. Il registro del
          servizio è in <code>%LOCALAPPDATA%\jeko\logs\jeko.log</code>.
        </p>
        <p><button id="retry" type="button">Riprova</button></p>
      </div>
    </main>
    <script>
      const SERVICE = 'http://127.0.0.1:4310';
      const TIMEOUT_MS = 30000;

      async function ready() {
        try {
          const res = await fetch(`${SERVICE}/api/health`, { cache: 'no-store' });
          return (await res.json()).app === 'jeko';
        } catch {
          return false;
        }
      }

      async function wait() {
        document.getElementById('wait').hidden = false;
        document.getElementById('fail').hidden = true;
        const end = Date.now() + TIMEOUT_MS;
        while (Date.now() < end) {
          if (await ready()) return location.replace(`${SERVICE}/`);
          await new Promise((r) => setTimeout(r, 250));
        }
        document.getElementById('wait').hidden = true;
        document.getElementById('fail').hidden = false;
      }

      document.getElementById('retry').addEventListener('click', wait);
      wait();
    </script>
  </body>
</html>
